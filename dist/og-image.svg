<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080b12"/>
      <stop offset="50%" style="stop-color:#0d1220"/>
      <stop offset="100%" style="stop-color:#171f36"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d9a441"/>
      <stop offset="100%" style="stop-color:#f0c978"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative geometric elements -->
  <circle cx="100" cy="100" r="80" fill="#d9a441" opacity="0.08"/>
  <circle cx="1100" cy="530" r="120" fill="#d9a441" opacity="0.06"/>
  <rect x="50" y="500" width="200" height="2" fill="#d9a441" opacity="0.15" rx="1"/>

  <!-- Main Content Area -->
  <g transform="translate(600, 315)">
    <!-- Logo/Icon -->
    <g transform="translate(-120, -120)">
      <rect x="0" y="0" width="240" height="240" rx="40" fill="#0c0c0a" stroke="#d9a441" stroke-width="3"/>
      <path d="M 60 150 L 120 90 L 180 150 V 210 L 60 150 Z" fill="none" stroke="#d9a441" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 90 165 L 120 135 L 150 165" fill="none" stroke="#d9a441" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Title -->
    <text x="0" y="-20" font-family="Georgia, serif" font-size="48" font-weight="600" fill="#f5f2ea" text-anchor="middle" letter-spacing="-1.5">
      Your voice,
      <tspan x="0" y="55" font-style="italic" fill="#d9a441">counted.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="110" font-family="system-ui, sans-serif" font-size="22" fill="#cfc7b7" text-anchor="middle" textLength="900" lengthAdjust="spacingAndGlyphs">
      Secure, anonymous &amp; receipt-verifiable online voting
    </text>

    <!-- CTA Buttons -->
    <g transform="translate(-150, 160)">
      <rect x="0" y="0" width="280" height="56" rx="28" fill="url(#accentGradient)" filter="url(#glow)"/>
      <text x="140" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#0c0c0a" text-anchor="middle">Browse elections &#8594;</text>
    </g>
    <g transform="translate(150, 160)">
      <rect x="0" y="0" width="280" height="56" rx="28" fill="none" stroke="#d9a441" stroke-width="2"/>
      <text x="140" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#f0c978" text-anchor="middle">Verify a receipt</text>
    </g>

    <!-- Trust badges -->
    <g transform="translate(-250, 260)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d9a441" text-anchor="middle" letter-spacing="1">SECURE &#183; ANONYMOUS &#183; RECEIPT-VERIFIED</text>
      <g transform="translate(0, 35)">
        <g transform="translate(-60, 0)">
          <circle cx="0" cy="0" r="20" fill="#d9a441" opacity="0.15"/>
          <text x="0" y="5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#d9a441" text-anchor="middle">1</text>
        </g>
        <text x="45" y="5" font-family="system-ui, sans-serif" font-size="11" fill="#f5f2ea" text-anchor="middle">One person, one vote</text>
      </g>
      <g transform="translate(180, 35)">
        <circle cx="0" cy="0" r="20" fill="#d9a441" opacity="0.15"/>
        <path d="M -6 0 L 0 -6 L 6 0 M 0 -6 L 0 6" stroke="#d9a441" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="170" y="5" font-family="system-ui, sans-serif" font-size="11" fill="#f5f2ea" text-anchor="middle">Secret ballot</text>
      <g transform="translate(360, 35)">
        <circle cx="0" cy="0" r="20" fill="#d9a441" opacity="0.15"/>
        <path d="M -6 6 L 0 0 L 6 6 M 10 4 L 4 10 M 0 -6 L 0 6 M -10 -4 L -4 4" stroke="#d9a441" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="45" y="5" font-family="system-ui, sans-serif" font-size="11" fill="#f5f2ea" text-anchor="middle">Receipt verified</text>
    </g>
  </g>
</svg>

