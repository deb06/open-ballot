# Render Blueprint — free tier web service + free PostgreSQL.
# Deploy: https://render.com/deploy?repo=<your-repo-url>
services:
  - type: web
    name: open-ballot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Open Ballot
      - key: APP_URL
        sync: false
      - key: DB_DRIVER
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: open-ballot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: open-ballot-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: open-ballot-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: open-ballot-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: open-ballot-db
          property: password
      # Set this in the Render dashboard to point at the permanent Neon DB.
      # When present, config.php uses it instead of the DB_* variables above.
      - key: DATABASE_URL
        sync: false
      # Set this in the Render dashboard to the same key that minted the
      # imported receipt hashes (local data/secret.key), so receipts verify.
      - key: APP_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@openballot.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: REGISTRATION_OPEN
        value: "1"
      - key: APP_ENV
        value: production
      - key: SESSION_IDLE_HOURS
        value: "24"
      # Real email delivery. Without these, mail() only writes data/mail.log.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # SMS delivery. Leave SMS_PROVIDER unset to use the local outbox log.
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_TWILIO_SID
        sync: false
      - key: SMS_TWILIO_TOKEN
        sync: false
      - key: SMS_FROM
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OAUTH_GITHUB_ID
        sync: false
      - key: OAUTH_GITHUB_SECRET
        sync: false
      - key: OAUTH_GOOGLE_ID
        sync: false
      - key: OAUTH_GOOGLE_SECRET
        sync: false

databases:
  - name: open-ballot-db
    plan: free
    databaseName: open_ballot
    user: openballot
