# Render Blueprint — free tier web service + free PostgreSQL.
# Deploy: https://render.com/deploy?repo=<your-repo-url>
services:
  - type: web
    name: open-ballot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Open Ballot
      - key: APP_URL
        sync: false
      - key: DB_DRIVER
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: open-ballot-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: open-ballot-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: open-ballot-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: open-ballot-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: open-ballot-db
          property: password
      - key: ADMIN_EMAIL
        value: admin@openballot.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: REGISTRATION_OPEN
        value: "1"
      - key: APP_ENV
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OAUTH_GITHUB_ID
        sync: false
      - key: OAUTH_GITHUB_SECRET
        sync: false
      - key: OAUTH_GOOGLE_ID
        sync: false
      - key: OAUTH_GOOGLE_SECRET
        sync: false

databases:
  - name: open-ballot-db
    plan: free
    databaseName: open_ballot
    user: openballot
