services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: development
      APP_URL: http://localhost:8080
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: open_ballot
      DB_USER: openballot
      DB_PASS: OpenBallot#2026
      ADMIN_EMAIL: admin@openballot.local
      ADMIN_PASSWORD: Admin#2026
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: open_ballot
      POSTGRES_USER: openballot
      POSTGRES_PASSWORD: OpenBallot#2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openballot -d open_ballot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
