    <script type="application/ld+json" id="site-jsonld">
{
  "@context": "https://schema.org",
  "@graph": [
    { "@type": "Organization", "name": "Open Ballot", "url": "https://open-ballot.onrender.com/", "description": "Secure, anonymous and receipt-verifiable online voting.", "contactPoint": { "@type": "ContactPoint", "contactType": "security", "email": "admin@openballot.local" } },

    <meta name="description" content="Open Ballot is a secure, anonymous and receipt-verifiable online voting platform for student and community elections. One person, one vote." data-dynamic="description" />

    <script src="/js/theme.js"></script>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/" aria-label="Open Ballot home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 12.5 16 7l10 5.5v9L16 27 6 21.5v-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              <path d="m11 15 3.5 3.5L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-name">Open<span>Ballot</span></span>
            <span class="brand-sub">Secure online voting</span>
          </span>
        </a>

        <nav class="primary-nav" id="primary-nav" aria-label="Primary">
          <a href="/" data-nav="elections">Elections</a>
          <a href="/verify" data-nav="verify">Verify ballot</a>
          <a href="/admin" data-nav="admin" hidden>Admin</a>
        </nav>

        <div class="header-actions" id="header-actions"></div>

        <button
          class="nav-toggle"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-nav"
          aria-label="Toggle navigation"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="main" class="shell" tabindex="-1">
      <noscript>
        <div class="empty-state">
          <h1>JavaScript is required</h1>
          <p>Open Ballot needs JavaScript enabled to cast and verify ballots securely.</p>
        </div>
      </noscript>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p class="footer-brand"><strong>Open Ballot</strong> — decisions made together.</p>
        <p class="footer-note">Secret ballots · One person, one vote · Receipt-verifiable</p>
        <nav class="footer-links" aria-label="Footer">
          <a href="/help">Help</a>
          <a href="/privacy">Privacy</a>
          <a href="/audit">Audit chain</a>
          <a href="/status">Status</a>
          <a href="/openapi.json">API</a>
        </nav>
      </div>
    </footer>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="/js/vendor/qrcode.js" defer></script>
    <script src="/js/meta.js" defer></script>
    <script src="/js/core.js" defer></script>
    <script src="/js/components.js" defer></script>
    <script src="/js/public.js" defer></script>
    <script src="/js/admin.js" defer></script>
    <script src="/js/design.js" defer></script>
  </body>
